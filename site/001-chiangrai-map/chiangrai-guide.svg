  <script><![CDATA[
    (function(){
      var match=location.hash.match(/^#area-(\d{2})$/);
      if(!match)return;
      var expected='index.html#area-'+match[1];
      var links=document.querySelectorAll('.link');
      for(var i=0;i<links.length;i++){
