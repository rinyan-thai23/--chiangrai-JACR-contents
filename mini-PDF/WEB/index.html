  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>

      margin-bottom: 12px;
    }
    .portal-desc {

      flex-wrap: wrap;

      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 22px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);

      display: flex;
      flex-direction: column;

    .portal-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-light);
    }

      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card-id {

      font-weight: 800;
      color: var(--primary);
      background: #ccfbf1;
      padding: 4px 10px;
      border-radius: 8px;

      font-size: 1.15rem;
      color: #0f172a;
      line-height: 1.4;

      margin-top: 6px;
      flex-grow: 1;
    }

      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 600;
    }
    .portal-footer {
      background: #0f172a;
      color: #94a3b8;
      padding: 40px 0;
      text-align: center;
      font-size: 0.88rem;

</head>
<body>

  <header class="portal-header">

    </div>
  </header>

  <main class="portal-main container">
    <div class="grid-container" id="portalGrid"></div>
  </main>

  <footer class="portal-footer">
    <div class="container">
      <p>© 2026 JACR Chiang Rai Contents. All Rights Reserved.</p>
    </div>
  </footer>

      { id: "004", title: "ドイチャン＆ドイメーサロン「最高峰コーヒー＆高山茶」ガイド", desc: "チェンライの二大名産地で巡る絶景農園・カフェ・テイスティング。" },
      { id: "005", title: "チェンライ県内の天然温泉利用ガイド", desc: "ポンプラバートやフワイサック等、足湯・個室風呂・温泉卵体験。" },

    const grid = document.getElementById('portalGrid');
    items.forEach(item => {
      const card = document.createElement('a');
      card.href = `${item.id}/index.html`;
      card.className = 'portal-card';
      card.innerHTML = `
        <div class="card-top">
          <span class="card-id">No.${item.id}</span>
          <h2 class="card-title">${item.title}</h2>
        </div>
        <p class="card-desc">${item.desc}</p>
        <div class="card-footer">
          <span>ガイドを開く →</span>
          <span>A4印刷対応</span>

      grid.appendChild(card);
