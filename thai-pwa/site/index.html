<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイ在住者のための道具箱</title>
<style>
:root { --bg: #f3f5f2; --ink: #14201f; --muted: #4c5a58; --line: #cdd6d3; --accent: #0b5d57; }
@media (prefers-color-scheme: dark) { :root { --bg: #101716; --ink: #e9efed; --muted: #a7b5b2; --line: #33413e; --accent: #5cc2b6; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 "BIZ UDPGothic", "Hiragino Sans", system-ui, sans-serif; }
.wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 1.4rem; }
a.app { display: block; padding: 16px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; }
a.app b { color: var(--accent); }
a.app span { display: block; color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>タイ在住者のための道具箱</h1>
  <a class="app" href="/90day/"><b>90日レポート</b><span>期限を表示して、近づいたら通知でお知らせします</span></a>
</div>
</body>
</html>
